name: Drivers
on:
  push:
    paths: ['Drivers/**', 'examples/**/driver-config.json', 'examples/**/tests/declared-values.json', 'examples/**/Dockerfile', 'tools/**', '.github/workflows/drivers.yml']
  pull_request:
    paths: ['Drivers/**', 'examples/**/driver-config.json', 'examples/**/tests/declared-values.json', 'examples/**/Dockerfile', 'tools/**', '.github/workflows/drivers.yml']
  workflow_dispatch:

# Fork contributions can validate drivers but cannot publish packages or access secrets.
permissions:
  contents: read

jobs:
  # Informational: Driver Hub support is optional, so this job never fails a driver's
  # pull request or release. Findings appear as annotations and in the job summary.
  compatibility:
    name: Driver Hub compatibility (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the schema validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-jsonschema
      - name: Report which drivers Driver Hub can build and deploy
        run: /usr/bin/python3 tools/validate-driver.py directory --all --report

  # The validator's own tests. These fail only when the schemas or tools regress.
  tooling:
    name: Driver Hub schemas and tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the schema validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-jsonschema
      - name: Schema fixtures (one valid and one invalid case per rule)
        run: /usr/bin/python3 tools/validate-driver.py fixtures
      - name: Release and OCI checks
        run: /usr/bin/python3 -m unittest discover -s tools/tests
