name: Rust example
on:
  push:
    paths: ['examples/rust_example/**', '.github/workflows/rust-example.yml']
  pull_request:
    paths: ['examples/rust_example/**', '.github/workflows/rust-example.yml']
  workflow_dispatch:

# Fork contributions can validate the example but cannot publish packages or access secrets.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/rust_example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo doc --locked --no-deps
      - name: Scan the locked Rust graph
        run: |
          # A stripped native image cannot expose its Cargo graph to an image scanner.
          docker run --rm -v "$PWD/Cargo.lock:/source/Cargo.lock:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /source

  image:
    needs: checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/rust_example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact candidate runtime image
        run: docker build --pull --target runtime -t rust-example:${{ github.sha }} .
      - name: Save candidate for an unprivileged offline-image scan
        run: docker save rust-example:${{ github.sha }} -o "$RUNNER_TEMP/rust-example.tar"
      - name: Block fixable high or critical vulnerabilities
        run: |
          # The scanner gets the image archive, not the Docker socket or registry credentials.
          docker run --rm \
            -v "$RUNNER_TEMP/rust-example.tar:/image.tar:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Verify non-root read-only execution
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            rust-example:${{ github.sha }} --version
      - name: Verify singleton Compose lifecycle without a live target
        run: sh scripts/runtime-smoke.sh rust-example:${{ github.sha }}
      # Publication is intentionally absent. A future release job must promote the
      # tested digest only after the required separate VideoIPath commissioning.
