name: Rust example
on:
  push:
    paths: ['examples/rust_example/**', 'Drivers/schemas/**', '.github/workflows/rust-example.yml']
  pull_request:
    paths: ['examples/rust_example/**', 'Drivers/schemas/**', '.github/workflows/rust-example.yml']
  workflow_dispatch:

# Fork contributions can validate the example but cannot publish packages or access secrets.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/rust_example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo test --locked --features device-lab --all-targets
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Explicit local soak (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: SOAK_SECONDS=120 sh scripts/soak.sh
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Validate Compose and literal environment quoting
        run: cargo test --locked --test deployment_contract compose_preserves_literal_credentials_without_printing_them -- --ignored --exact
      - name: Scan the locked Rust graph
        run: |
          # A stripped native image cannot expose its Cargo graph to an image scanner.
          docker run --rm -v "$PWD/Cargo.lock:/source/Cargo.lock:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /source

  image:
    needs: checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/rust_example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the DriverHub candidate from this revision
        run: |
          docker buildx create --driver docker-container --use
          python3 scripts/package-driverhub.py "$RUNNER_TEMP/driverhub"
      - name: Validate both v1 records and import the packaged image for testing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo python3-jsonschema
          /usr/bin/python3 - "$RUNNER_TEMP/driverhub" <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for name in ("driver-release", "driver-config"):
              schema = json.loads(Path(f"../../Drivers/schemas/{name}-v1.schema.json").read_text())
              record = json.loads((Path(sys.argv[1]) / f"{name}.json").read_text())
              Draft202012Validator(schema).validate(record)
          PY
          gzip -dc "$RUNNER_TEMP"/driverhub/*.oci.tar.gz > "$RUNNER_TEMP/driverhub-image.tar"
          skopeo copy "oci-archive:$RUNNER_TEMP/driverhub-image.tar" "docker-daemon:rust-example:${{ github.sha }}"
      - name: Save candidate for an unprivileged offline-image scan
        run: docker save rust-example:${{ github.sha }} -o "$RUNNER_TEMP/rust-example.tar"
      - name: Block fixable high or critical vulnerabilities
        run: |
          # The scanner gets the image archive, not the Docker socket or registry credentials.
          docker run --rm \
            -v "$RUNNER_TEMP/rust-example.tar:/image.tar:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Verify non-root read-only execution
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            rust-example:${{ github.sha }} --version
      - name: Verify singleton Compose lifecycle without a live target
        run: sh scripts/runtime-smoke.sh rust-example:${{ github.sha }}
      # Publication is intentionally absent. A future release job must promote the
      # tested digest only after the required separate VideoIPath commissioning.
