# Deliberately image-only: deployment cannot implicitly build from an operator's checkout.
name: "${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}"

# Common restrictions are invariants, not environment-controlled security switches.
x-runtime: &runtime
  image: "${DRIVER_IMAGE:?Set DRIVER_IMAGE}"
  restart: "${DRIVER_RESTART_POLICY:-on-failure:5}"
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: "${DRIVER_STOP_GRACE_PERIOD:-20s}"
  cpus: "${DRIVER_CPU_LIMIT:-0.50}"
  mem_limit: "${DRIVER_MEMORY_LIMIT:-256m}"
  pids_limit: "${DRIVER_PIDS_LIMIT:-128}"
  logging:
    driver: local
    options:
      max-size: "${DRIVER_LOG_MAX_SIZE:-10m}"
      max-file: "${DRIVER_LOG_MAX_FILES:-5}"
  healthcheck:
    # Reads only this process's local heartbeat; no credentials or target traffic.
    test: [CMD, /usr/local/bin/rust-example, health]
    interval: "${DRIVER_HEALTHCHECK_INTERVAL:-30s}"
    timeout: "${DRIVER_HEALTHCHECK_TIMEOUT:-5s}"
    retries: "${DRIVER_HEALTHCHECK_RETRIES:-3}"
    start_period: "${DRIVER_HEALTHCHECK_START_PERIOD:-15s}"

services:
  driver:
    <<: *runtime
    command: [driver]
    environment:
      # Explicit forwarding prevents unrelated host environment from entering the process.
      VIDEOIPATH_URL: "${VIDEOIPATH_URL:?Set VIDEOIPATH_URL}"
      VIDEOIPATH_TOKEN: "${VIDEOIPATH_TOKEN:?Set VIDEOIPATH_TOKEN}"
      VIDEOIPATH_NODE_ID: "${VIDEOIPATH_NODE_ID:?Set VIDEOIPATH_NODE_ID}"
      VIDEOIPATH_CA_BUNDLE: "${VIDEOIPATH_CA_BUNDLE:-}"
      DRIVER_STATE_DIRECTORY: "${DRIVER_STATE_DIRECTORY:-/var/lib/rust-example}"
      DRIVER_LOCK_DIRECTORY: "${DRIVER_LOCK_DIRECTORY:-/var/lock/videoipath-drivers}"
      DRIVER_LOG_LEVEL: "${DRIVER_LOG_LEVEL:-info}"
      DRIVER_CONFIGURATION_ORDER: "${DRIVER_CONFIGURATION_ORDER:-senders_first}"
      DRIVER_REQUEST_LIMIT: "${DRIVER_REQUEST_LIMIT:-16}"
      DRIVER_OUTBOUND_LIMIT: "${DRIVER_OUTBOUND_LIMIT:-128}"
      DRIVER_MAX_FRAME_BYTES: "${DRIVER_MAX_FRAME_BYTES:-1048576}"
      DRIVER_REQUEST_TIMEOUT_MS: "${DRIVER_REQUEST_TIMEOUT_MS:-5000}"
      DRIVER_IPT_TIMEOUT_MS: "${DRIVER_IPT_TIMEOUT_MS:-20000}"
      DRIVER_RECONNECT_MIN_MS: "${DRIVER_RECONNECT_MIN_MS:-500}"
      DRIVER_RECONNECT_MAX_MS: "${DRIVER_RECONNECT_MAX_MS:-30000}"
      DRIVER_SHUTDOWN_TIMEOUT_MS: "${DRIVER_SHUTDOWN_TIMEOUT_MS:-5000}"
    volumes:
      - type: volume
        source: driver-state
        target: "${DRIVER_STATE_DIRECTORY:-/var/lib/rust-example}"
      - type: bind
        source: "${DRIVER_CERTIFICATE_HOST_PATH:-./deployment/certificates}"
        target: /etc/rust-example/certificates
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # Every project on this host MUST bind the same directory for node ownership.
        source: "${DRIVER_LOCK_HOST_PATH:-/var/lock/videoipath-drivers}"
        target: "${DRIVER_LOCK_DIRECTORY:-/var/lock/videoipath-drivers}"
        bind:
          create_host_path: false

# Persist local driver diagnostics across container recreation.
volumes:
  driver-state:
